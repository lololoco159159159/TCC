tton>\n        <\u002Fsc-if>\n\n        <!-- Legenda + filtro por tipo -->\n        <sc-if value=\"{{ mostrarLegenda }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"position:absolute; bottom:14px; right:14px; background:#FBF8F1; border:1px solid #E6DECB; border-radius:14px; padding:12px 14px; box-shadow:0 10px 26px rgba(28,38,32,.10); width:196px\">\n            <div style=\"font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:.16em; color:#9A958A; text-transform:uppercase; margin-bottom:9px\">Tipos de nó<\u002Fdiv>\n            <div style=\"display:flex; flex-direction:column; gap:6px\">\n              <sc-for list=\"{{ legenda }}\" as=\"lg\" hint-placeholder-count=\"3\">\n                <button onclick=\"{{ lg.onToggle }}\" title=\"Mostrar/ocultar este tipo (reconsulta o endpoint)\" style=\"display:flex; align-items:center; gap:9px; padding:5px 7px; margin:0 -7px; border:none; background:transparent; border-radius:8px; cursor:pointer; font-family:'Figtree',system-ui,sans-serif; opacity:{{ lg.opacidade }}\" style-hover=\"background:#F3EDDF\">\n                  <span style=\"width:11px; height:11px; border-radius:{{ lg.raio }}; clip-path:{{ lg.clip }}; background:{{ lg.cor }}; flex:none\"><\u002Fspan>\n                  <span style=\"flex:1; text-align:left; font-size:12.5px; font-weight:600; color:#3C4843; text-decoration:{{ lg.risco }}\">{{ lg.label }}<\u002Fspan>\n                  <span style=\"font-family:'JetBrains Mono',monospace; font-size:10.5px; color:#9A958A\">{{ lg.qtd }}<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"border-top:1px dashed #E6DECB; margin-top:9px; padding-top:8px; display:flex; align-items:center; gap:8px\">\n              <svg width=\"20\" height=\"8\" viewBox=\"0 0 20 8\"><line x1=\"0\" y1=\"4\" x2=\"20\" y2=\"4\" stroke=\"#9A958A\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"><\u002Fline><\u002Fsvg>\n              <span style=\"font-size:11px; color:#9A958A\">progressão entre anos<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- Zoom + cores -->\n        <div style=\"position:absolute; top:14px; right:14px; display:flex; flex-direction:column; gap:6px; align-items:flex-end\">\n          <button onclick=\"{{ onZoomMais }}\" title=\"Aproximar\" style=\"width:34px; height:34px; border-radius:10px; border:1px solid #E6DECB; background:#FBF8F1; color:#3C4843; font-size:17px; font-weight:600; cursor:pointer; box-shadow:0 4px 12px rgba(28,38,32,.07); font-family:'Figtree',system-ui,sans-serif\" style-hover=\"border-color:#06492D; color:#06492D\">+<\u002Fbutton>\n          <button onclick=\"{{ onZoomMenos }}\" title=\"Afastar\" style=\"width:34px; height:34px; border-radius:10px; border:1px solid #E6DECB; background:#FBF8F1; color:#3C4843; font-size:19px; cursor:pointer; box-shadow:0 4px 12px rgba(28,38,32,.07); font-family:'Figtree',system-ui,sans-serif\" style-hover=\"border-color:#06492D; color:#06492D\">−<\u002Fbutton>\n          <button onclick=\"{{ onRecentrar }}\" title=\"Recentrar o grafo\" style=\"width:34px; height:34px; border-radius:10px; border:1px solid #E6DECB; background:#FBF8F1; cursor:pointer; box-shadow:0 4px 12px rgba(28,38,32,.07); display:flex; align-items:center; justify-content:center\" style-hover=\"border-color:#06492D\">\n            <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3C4843\" stroke-width=\"2\">\n              <path d=\"M3 9V5a2 2 0 0 1 2-2h4\"><\u002Fpath><path d=\"M15 3h4a2 2 0 0 1 2 2v4\"><\u002Fpath>\n              <path d=\"M21 15v4a2 2 0 0 1-2 2h-4\"><\u002Fpath><path d=\"M9 21H5a2 2 0 0 1-2-2v-4\"><\u002Fpath>\n              <circle cx=\"12\" cy=\"12\" r=\"2.4\"><\u002Fcircle>\n            <\u002Fsvg>\n          <\u002Fbutton>\n          <button onclick=\"{{ onTogglePaleta }}\" title=\"Cores do grafo — opções acessíveis para daltonismo\" style=\"width:34px; height:34px; border-radius:10px; border:1px solid {{ paletaBotaoBorda }}; background:#FBF8F1; cursor:pointer; box-shadow:0 4px 12px rgba(28,38,32,.07); display:flex; align-items:center; justify-content:center\" style-hover=\"border-color:#06492D\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\">\n              <circle cx=\"9\" cy=\"9\" r=\"4.6\" fill=\"{{ swHab }}\" opacity=\"0.9\"><\u002Fcircle>\n              <circle cx=\"15.5\" cy=\"9.6\" r=\"4.6\" fill=\"{{ swConc }}\" opacity=\"0.82\"><\u002Fcircle>\n              <circle cx=\"12\" cy=\"15.4\" r=\"4.6\" fill=\"{{ swDisc }}\" opacity=\"0.82\"><\u002Fcircle>\n            <\u002Fsvg>\n          <\u002Fbutton>\n\n          <sc-if value=\"{{ paletaAberta }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"width:262px; background:#FBF8F1; border:1px solid #E6DECB; border-radius:14px; padding:12px 13px; box-shadow:0 14px 34px rgba(28,38,32,.14); animation:surgir .14s ease\">\n              <div style=\"font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:.16em; color:#9A958A; text-transform:uppercase; margin-bottom:9px\">Cores do grafo · daltonismo<\u002Fdiv>\n              <div style=\"display:flex; flex-direction:column; gap:4px\">\n                <sc-for list=\"{{ paletas }}\" as=\"pl\" hint-placeholder-count=\"4\">\n                  <button onclick=\"{{ pl.onPick }}\" style=\"display:flex; align-items:center; gap:9px; width:100%; padding:7px 9px; border:1px solid {{ pl.borda }}; background:{{ pl.bg }}; border-radius:10px; cursor:pointer; font-family:'Figtree',system-ui,sans-serif; text-align:left\" style-hover=\"border-color:#06492D\">\n                    <span style=\"display:inline-flex; gap:3px; flex:none\">\n                      <span style=\"width:10px; height:10px; border-radius:50%; background:{{ pl.c1 }}\"><\u002Fspan>\n                      <span style=\"width:10px; height:10px; border-radius:50%; background:{{ pl.c2 }}\"><\u002Fspan>\n                      <span style=\"width:10px; height:10px; border-radius:50%; background:{{ pl.c3 }}\"><\u002Fspan>\n                    <\u002Fspan>\n                    <span style=\"flex:1; min-width:0\">\n                      <span style=\"display:block; font-size:12.5px; font-weight:700; color:#1C2620\">{{ pl.nome }}<\u002Fspan>\n                      <span style=\"display:block; font-size:10.5px; color:#9A958A\">{{ pl.sub }}<\u002Fspan>\n                    <\u002Fspan>\n                    <span style=\"font-size:12px; color:#06492D; font-weight:700; opacity:{{ pl.checkOp }}\">✓<\u002Fspan>\n                  <\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"border-top:1px dashed #E6DECB; margin-top:9px; padding-top:5px\">\n                <button onclick=\"{{ onToggleFormas }}\" style=\"display:flex; align-items:center; gap:10px; width:100%; padding:7px 6px; border:none; background:transparent; border-radius:9px; cursor:pointer; font-family:'Figtree',system-ui,sans-serif; text-align:left\" style-hover=\"background:#F3EDDF\">\n                  <span style=\"flex:1; min-width:0\">\n                    <span style=\"display:block; font-size:12px; font-weight:700; color:#1C2620\">Formas em vez de cores<\u002Fspan>\n                    <span style=\"display:block; font-size:10px; color:#9A958A\">bola · quadrado · triângulo<\u002Fspan>\n                  <\u002Fspan>\n                  <span style=\"width:34px; height:20px; border-radius:999px; background:{{ formasBg }}; position:relative; flex:none; transition:background .15s\">\n                    <span style=\"position:absolute; top:2px; left:{{ formasKnob }}px; width:16px; height:16px; border-radius:50%; background:#FFFFFF; box-shadow:0 1px 3px rgba(0,0,0,.3); transition:left .15s\"><\u002Fspan>\n                  <\u002Fspan>\n                <\u002Fbutton>\n                <button onclick=\"{{ onToggleSemAnim }}\" style=\"display:flex; align-items:center; gap:10px; width:100%; padding:7px 6px; border:none; background:transparent; border-radius:9px; cursor:pointer; font-family:'Figtree',system-ui,sans-serif; text-align:left\" style-hover=\"background:#F3EDDF\">\n                  <span style=\"flex:1; min-width:0\">\n                    <span style=\"display:block; font-size:12px; font-weight:700; color:#1C2620\">Desativar animações e física<\u002Fspan>\n                    <span style=\"display:block; font-size:10px; color:#9A958A\">grafo estático, sem movimento<\u002Fspan>\n                  <\u002Fspan>\n                  <span style=\"width:34px; height:20px; border-radius:999px; background:{{ semAnimBg }}; position:relative; flex:none; transition:background .15s\">\n                    <span style=\"position:absolute; top:2px; left:{{ semAnimKnob }}px; width:16px; height:16px; border-radius:50%; background:#FFFFFF; box-shadow:0 1px 3px rgba(0,0,0,.3); transition:left .15s\"><\u002Fspan>\n                  <\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <!-- Gaveta da consulta SPARQL (canto inferior direito, ao lado da legenda) -->\n        <div style=\"position:absolute; bottom:14px; right:224px; display:flex; flex-direction:column; align-items:flex-end\">\n          <sc-if value=\"{{ drawerAberto }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:#FBF8F1; border:1px solid #E6DECB; border-radius:14px; padding:14px 16px; box-shadow:0 14px 34px rgba(28,38,32,.14); margin-bottom:8px; width:560px; animation:surgir .16s ease\">\n              <div style=\"display:flex; align-items:center; gap:8px; margin-bottom:9px\">\n                <span style=\"width:6px; height:6px; border-radius:50%; background:#8C3E18\"><\u002Fspan>\n                <span style=\"font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:.16em; color:#5C6660; text-transform:uppercase\">Última consulta ao endpoint<\u002Fspan>\n                <span style=\"flex:1\"><\u002Fspan>\n                <span style=\"font-family:'JetBrains Mono',monospace; font-size:10px; color:#9A958A\">{{ tempoLabel }}<\u002Fspan>\n              <\u002Fdiv>\n              <pre style=\"margin:0; max-height:180px; overflow:auto; background:#1C2620; color:#DDE6DF; border-radius:10px; padding:12px 14px; font-family:'JetBrains Mono',monospace; font-size:10.5px; line-height:1.55; white-space:pre\">{{ consultaTexto }}<\u002Fpre>\n              <label style=\"display:flex; align-items:center; gap:8px; margin-top:10px; cursor:pointer; font-size:12.5px; color:#3C4843; font-weight:500\">\n                <input type=\"checkbox\" checked=\"{{ simErro }}\" onchange=\"{{ onSimErro }}\" style=\"accent-color:#8C3E18; cursor:pointer\">\n                <span>Simular falha do endpoint (HTTP 503) na próxima consulta<\u002Fspan>\n              <\u002Flabel>\n              <p style=\"margin:8px 0 0; font-size:11.5px; line-height:1.5; color:#9A958A\">Dados de demonstração. Na implementação, substitua <span style=\"font-family:'JetBrains Mono',monospace; font-size:10.5px\">consultarFuseki()<\u002Fspan> por um fetch ao serviço Fuseki — o formato de resposta (sparql-results+json) é o mesmo.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <button onclick=\"{{ onToggleDrawer }}\" style=\"display:inline-flex; align-items:center; gap:8px; padding:8px 14px; border-radius:999px; border:1px solid #E6DECB; background:#FBF8F1; cursor:pointer; box-shadow:0 6px 16px rgba(28,38,32,.08); font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.12em; color:#3C4843; text-transform:uppercase\" style-hover=\"border-color:#06492D; color:#06492D\">\n            <span style=\"width:6px; height:6px; border-radius:50%; background:{{ drawerCorPonto }}\"><\u002Fspan>\n            <span>SPARQL<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fdiv>\n\n        <!-- ── Painel de contexto: vidro flutuante à esquerda ── -->\n        <sc-if value=\"{{ painelVisivel }}\" hint-placeholder-val=\"{{ false }}\">\n          <aside style=\"position:absolute; top:12px; bottom:12px; left:{{ painelX }}px; width:{{ painelW }}px; display:flex; flex-direction:column; background:rgba(251,248,241,.72); backdrop-filter:blur(14px) saturate(1.15); border:1px solid rgba(216,206,184,.95); border-radius:18px; box-shadow:0 24px 60px rgba(28,38,32,.18); overflow:hidden; z-index:30\">\n\n            <!-- alça de arrasto -->\n            <div onpointerdown=\"{{ onPainelDrag }}\" title=\"Arraste para mover o painel\" style=\"flex:none; display:flex; align-items:center; gap:9px; padding:10px 14px; border-bottom:1px solid rgba(216,206,184,.7); cursor:grab; user-select:none; touch-action:none\">\n              <svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"#9A958A\"><circle cx=\"7\" cy=\"5\" r=\"1.6\"><\u002Fcircle><circle cx=\"17\" cy=\"5\" r=\"1.6\"><\u002Fcircle><circle cx=\"7\" cy=\"12\" r=\"1.6\"><\u002Fcircle><circle cx=\"17\" cy=\"12\" r=\"1.6\"><\u002Fcircle><circle cx=\"7\" cy=\"19\" r=\"1.6\"><\u002Fcircle><circle cx=\"17\" cy=\"19\" r=\"1.6\"><\u002Fcircle><\u002Fsvg>\n              <span style=\"font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:.18em; color:#5C6660; text-transform:uppercase; flex:1\">Painel de contexto<\u002Fspan>\n              <button onclick=\"{{ onEsconderPainel }}\" title=\"Esconder painel\" style=\"width:26px; height:26px; border-radius:8px; border:1px solid #E6DECB; background:rgba(247,242,232,.7); color:#5C6660; cursor:pointer; display:flex; align-items:center; justify-content:center; font-family:'Figtree',system-ui,sans-serif\" style-hover=\"border-color:#06492D; color:#06492D\">\n                <svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m11 17-5-5 5-5\"><\u002Fpath><path d=\"m18 17-5-5 5-5\"><\u002Fpath><\u002Fsvg>\n              <\u002Fbutton>\n            <\u002Fdiv>\n\n            <!-- conteúdo -->\n            <sc-if value=\"{{ semSelecao }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"flex:1; overflow-y:auto; display:flex; flex-direction:column; padding:24px 26px 18px; gap:16px\">\n                <div style=\"display:flex; align-items:center; gap:12px\">\n                  <svg width=\"40\" height=\"40\" viewBox=\"0 0 52 52\" fill=\"none\" style=\"opacity:.65; flex:none\">\n                    <circle cx=\"14\" cy=\"36\" r=\"6\" fill=\"#C9BFA8\"><\u002Fcircle>\n                    <circle cx=\"30\" cy=\"14\" r=\"5\" fill=\"#C9BFA8\"><\u002Fcircle>\n                    <circle cx=\"41\" cy=\"33\" r=\"4.4\" fill=\"#B4A98D\"><\u002Fcircle>\n                    <line x1=\"14\" y1=\"36\" x2=\"30\" y2=\"14\" stroke=\"#C9BFA8\" stroke-width=\"1.6\"><\u002Fline>\n                    <line x1=\"30\" y1=\"14\" x2=\"41\" y2=\"33\" stroke=\"#C9BFA8\" stroke-width=\"1.6\"><\u002Fline>\n                    <line x1=\"14\" y1=\"36\" x2=\"41\" y2=\"33\" stroke=\"#C9BFA8\" stroke-width=\"1.6\" stroke-dasharray=\"4 3\"><\u002Fline>\n                  <\u002Fsvg>\n                  <h2 style=\"font-family:'Spectral',serif; font-weight:700; font-size:22px; margin:0; color:#1C2620\">Painel de contexto<\u002Fh2>\n                <\u002Fdiv>\n                <p style=\"font-size:14.5px; line-height:1.65; color:#3C4843; margin:0\">Clique em um nó do grafo para ver aqui o <strong>texto oficial da habilidade<\u002Fstrong>, suas conexões agrupadas por relação e a fonte normativa.<\u002Fp>\n                <div style=\"display:flex; flex-direction:column; gap:9px; font-size:13px; color:#5C6660; background:rgba(247,242,232,.75); border:1px dashed #D8CEB8; border-radius:12px; padding:13px 15px\">\n                  <div style=\"display:flex; gap:10px\"><span style=\"font-family:'JetBrains Mono',monospace; font-size:11px; color:#06492D; flex:none; width:60px\">hover<\u002Fspan><span>destaca as conexões do nó<\u002Fspan><\u002Fdiv>\n                  <div style=\"display:flex; gap:10px\"><span style=\"font-family:'JetBrains Mono',monospace; font-size:11px; color:#06492D; flex:none; width:60px\">clique<\u002Fspan><span>abre os detalhes aqui<\u002Fspan><\u002Fdiv>\n                  <div style=\"display:flex; gap:10px\"><span style=\"font-family:'JetBrains Mono',monospace; font-size:11px; color:#06492D; flex:none; width:60px\">2× clique<\u002Fspan><span>expande as conexões do nó<\u002Fspan><\u002Fdiv>\n                  <div style=\"display:flex; gap:10px\"><span style=\"font-family:'JetBrains Mono',monospace; font-size:11px; color:#06492D; flex:none; width:60px\">arrastar<\u002Fspan><span>move nós ou o quadro; roda = zoom<\u002Fspan><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ temSelecao }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"flex:1; overflow-y:auto; padding:18px 22px 16px\">\n\n                <div style=\"display:flex; align-items:center; gap:9px; margin-bottom:13px\">\n                  <span style=\"width:10px; height:10px; border-radius:{{ sel.raio }}; clip-path:{{ sel.clip }}; background:{{ sel.cor }}; flex:none\"><\u002Fspan>\n                  <span style=\"font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.18em; color:#5C6660; text-transform:uppercase\">{{ sel.tipoLabel }}<\u002Fspan>\n                  <span style=\"flex:1\"><\u002Fspan>\n                  <button onclick=\"{{ onFechar }}\" title=\"Limpar seleção\" style=\"width:26px; height:26px; border-radius:8px; border:1px solid #E6DECB; background:transparent; color:#5C6660; font-size:15px; line-height:1; cursor:pointer; font-family:'Figtree',system-ui,sans-serif\" style-hover=\"border-color:#8C3E18; color:#8C3E18\">×<\u002Fbutton>\n                <\u002Fdiv>\n\n                <sc-if value=\"{{ sel.codigo }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"display:inline-block; font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:600; letter-spacing:.06em; color:#06492D; background:rgba(234,242,236,.9); border:1px solid #CFE0D4; border-radius:7px; padding:3px 9px; margin-bottom:10px\">{{ sel.codigo }}<\u002Fdiv>\n                <\u002Fsc-if>\n\n                <h2 style=\"font-family:'Spectral',serif; font-weight:700; font-size:23px; line-height:1.16; letter-spacing:-.015em; margin:0 0 12px; color:#1C2620\">{{ sel.titulo }}<\u002Fh2>\n\n                <div style=\"display:flex; flex-wrap:wrap; gap:6px; margin-bottom:18px\">\n                  <sc-for list=\"{{ sel.pills }}\" as=\"p\" hint-placeholder-count=\"2\">\n                    <span style=\"font-size:12px; font-weight:600; color:#3C4843; background:rgba(239,232,218,.9); border-radius:999px; padding:4px 11px\">{{ p.t }}<\u002Fspan>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n\n                <sc-if value=\"{{ sel.temBloco }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"margin-bottom:20px\">\n                    <div style=\"font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:.16em; color:#9A958A; text-transform:uppercase; margin-bottom:8px\">{{ sel.blocoLabel }}<\u002Fdiv>\n                    <sc-if value=\"{{ sel.carregando }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"display:flex; align-items:center; gap:10px; padding:16px 14px; background:rgba(247,242,232,.8); border-left:3px solid #06492D; border-radius:0 10px 10px 0\">\n                        <div style=\"width:16px; height:16px; border-radius:50%; border:2.5px solid #E6DECB; border-top-color:#06492D; animation:girar .8s linear infinite; flex:none\"><\u002Fdiv>\n                        <span style=\"font-family:'JetBrains Mono',monospace; font-size:10.5px; color:#9A958A\">consultando o endpoint…<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n                    <sc-if value=\"{{ sel.temTexto }}\" hint-placeholder-val=\"{{ false }}\">\n                      <blockquote style=\"margin:0; padding:14px 16px; background:rgba(247,242,232,.8); border-left:3px solid #06492D; border-radius:0 10px 10px 0; font-size:14px; line-height:1.68; color:#3C4843\">“{{ sel.blocoTexto }}”<\u002Fblockquote>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n\n                <div style=\"margin-bottom:20px\">\n                  <div style=\"display:flex; align-items:baseline; gap:8px; margin-bottom:10px\">\n                    <div style=\"font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:.16em; color:#9A958A; text-transform:uppercase\">Conexões<\u002Fdiv>\n                    <div style=\"font-family:'JetBrains Mono',monospace; font-size:10.5px; color:#5C6660\">({{ sel.totalConex }})<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"display:flex; flex-direction:column; gap:13px\">\n                    <sc-for list=\"{{ sel.grupos }}\" as=\"g\" hint-placeholder-count=\"2\">\n                      <div>\n                        <div style=\"display:flex; align-items:center; gap:8px; margin-bottom:5px\">\n                          <span style=\"font-size:13px; font-weight:700; color:#1C2620\">{{ g.rotulo }}<\u002Fspan>\n                          <span style=\"font-family:'JetBrains Mono',monospace; font-size:10px; color:#9A958A; background:rgba(239,232,218,.9); border-radius:999px; padding:1px 7px\">{{ g.qtd }}<\u002Fspan>\n                        <\u002Fdiv>\n                        <div style=\"display:flex; flex-direction:column; gap:3px\">\n                          <sc-for list=\"{{ g.itens }}\" as=\"it\" hint-placeholder-count=\"3\">\n                            <button onclick=\"{{ it.onIr }}\" title=\"{{ it.dica }}\" style=\"display:flex; align-items:center; gap:9px; width:100%; padding:6px 9px; margin:0 -9px; border:none; background:transparent; border-radius:9px; cursor:pointer; text-align:left; font-family:'Figtree',system-ui,sans-serif; opacity:{{ it.opacidade }}\" style-hover=\"background:rgba(243,237,223,.85)\">\n                              <span style=\"width:8px; height:8px; border-radius:{{ it.raio }}; clip-path:{{ it.clip }}; background:{{ it.cor }}; flex:none\"><\u002Fspan>\n                              <span style=\"flex:1; min-width:0; font-size:12.5px; font-weight:500; color:#1C2620; overflow:hidden; text-overflow:ellipsis; white-space:nowrap\">{{ it.principal }}<\u002Fspan>\n                              <span style=\"font-family:'JetBrains Mono',monospace; font-size:9.5px; color:#9A958A; flex:none\">{{ it.secundario }}<\u002Fspan>\n                              <sc-if value=\"{{ it.fora }}\" hint-placeholder-val=\"{{ false }}\">\n                                <span style=\"font-family:'JetBrains Mono',monospace; font-size:9px; color:#8C3E18; border:1px dashed #E0B9A8; border-radius:6px; padding:1px 5px; flex:none\">+ expandir<\u002Fspan>\n                              <\u002Fsc-if>\n                            <\u002Fbutton>\n                          <\u002Fsc-for>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <button onclick=\"{{ onExpandir }}\" style=\"width:100%; padding:10px 16px; border-radius:12px; border:1.5px solid #06492D; background:rgba(247,242,232,.5); color:#06492D; font-family:'Figtree',system-ui,sans-serif; font-size:13.5px; font-weight:600; cursor:pointer; margin-bottom:20px\" style-hover=\"background:rgba(234,242,236,.9)\">{{ expandLabel }}<\u002Fbutton>\n\n                <div style=\"border-top:1px solid rgba(216,206,184,.8); padding-top:14px\">\n                  <div style=\"font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:.16em; color:#9A958A; text-transform:uppercase; margin-bottom:9px\">Fonte oficial<\u002Fdiv>\n                  <div style=\"display:flex; flex-direction:column; gap:7px\">\n                    <a href=\"http://portal.mec.gov.br/docman/fevereiro-2022-pdf/236791-anexo-ao-parecer-cneceb-n-2-2022-bncc-computacao/file\" target=\"_blank\" rel=\"noopener\" style=\"font-size:12.5px; font-weight:600; color:#06492D; text-decoration:none; display:inline-flex; gap:6px; align-items:baseline\" style-hover=\"text-decoration:underline\"><span>BNCC — Computação (norma anexa ao Parecer CNE/CEB nº 2/2022)<\u002Fspan><span style=\"font-size:11px\">↗<\u002Fspan><\u002Fa>\n                    <a href=\"http://portal.mec.gov.br/index.php?option=com_docman&amp;view=download&amp;alias=236131-rceb001-22&amp;category_slug=fevereiro-2022-pdf&amp;Itemid=30192\" target=\"_blank\" rel=\"noopener\" style=\"font-size:12.5px; font-weight:600; color:#06492D; text-decoration:none; display:inline-flex; gap:6px; align-items:baseline\" style-hover=\"text-decoration:underline\"><span>Resolução CNE/CEB nº 1/2022<\u002Fspan><span style=\"font-size:11px\">↗<\u002Fspan><\u002Fa>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <!-- rodapé: vistos por último + assistente -->\n            <div style=\"flex:none; border-top:1px solid rgba(216,206,184,.8); padding:12px 22px 14px\">\n              <sc-if value=\"{{ temVistos }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"margin-bottom:12px\">\n                  <div style=\"font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:.16em; color:#9A958A; text-transform:uppercase; margin-bottom:7px\">Vistos por último<\u002Fdiv>\n                  <div style=\"display:flex; flex-wrap:wrap; gap:6px\">\n                    <sc-for list=\"{{ vistosUI }}\" as=\"v\" hint-placeholder-count=\"0\">\n                      <button onclick=\"{{ v.onIr }}\" title=\"{{ v.titulo }}\" style=\"display:inline-flex; align-items:center; gap:7px; padding:5px 11px; border-radius:999px; border:1px solid #D8CEB8; background:rgba(247,242,232,.75); font-family:'Figtree',system-ui,sans-serif; font-size:12px; font-weight:600; color:#3C4843; cursor:pointer\" style-hover=\"border-color:#06492D; color:#06492D\">\n                        <span style=\"width:7px; height:7px; border-radius:{{ v.raio }}; clip-path:{{ v.clip }}; background:{{ v.cor }}; flex:none\"><\u002Fspan>\n                        <span>{{ v.label }}<\u002Fspan>\n                      <\u002Fbutton>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <div style=\"display:flex; align-items:center; gap:8px; margin-bottom:8px\">\n                <svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#06492D\" stroke-width=\"2\"><path d=\"M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z\"><\u002Fpath><path d=\"M19 15l.9 2.4L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.6z\"><\u002Fpath><\u002Fsvg>\n                <span style=\"font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:.16em; color:#5C6660; text-transform:uppercase\">Assistente do grafo<\u002Fspan>\n                <span style=\"font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:.08em; color:#8C3E18; border:1px dashed #E0B9A8; border-radius:6px; padding:1px 6px; text-transform:uppercase\">em breve<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex; gap:7px\">\n                <input type=\"text\" value=\"{{ iaMsg }}\" onchange=\"{{ onIaChange }}\" onkeydown=\"{{ onIaTecla }}\" placeholder=\"Pergunte: onde “algoritmos” aparece no 7.º ano?\" style=\"flex:1; min-width:0; padding:9px 13px; border:1px solid #D8CEB8; border-radius:11px; background:rgba(247,242,232,.8); font-family:'Figtree',system-ui,sans-serif; font-size:13px; color:#1C2620; outline:none\" style-focus=\"border-color:#06492D; background:#FFFFFF\">\n                <button onclick=\"{{ onIaEnviar }}\" title=\"Enviar pergunta ao assistente\" style=\"width:37px; height:37px; flex:none; border-radius:11px; border:none; background:#06492D; cursor:pointer; display:flex; align-items:center; justify-content:center\" style-hover=\"background:#053C24\">\n                  <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#F7F2E8\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 2 11 13\"><\u002Fpath><path d=\"M22 2 15 22l-4-9-9-4z\"><\u002Fpath><\u002Fsvg>\n                <\u002Fbutton>\n              <\u002Fdiv>\n              <sc-if value=\"{{ iaAviso }}\" hint-placeholder-val=\"{{ false }}\">\n                <p style=\"margin:8px 0 0; font-size:11.5px; line-height:1.5; color:#9A958A; animation:surgir .16s ease\">Em desenvolvimento — aqui a IA vai transformar sua pergunta em uma consulta SPARQL e destacar a resposta no grafo.<\u002Fp>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n\n            <!-- alça de redimensionar (borda direita) -->\n            <div onpointerdown=\"{{ onPainelResize }}\" title=\"Arraste para redimensionar\" style=\"position:absolute; top:0; bottom:0; right:0; width:9px; cursor:ew-resize; touch-action:none\"><\u002Fdiv>\n          <\u002Faside>\n        <\u002Fsc-if>\n\n        <!-- aba para reabrir o painel -->\n        <sc-if value=\"{{ painelEscondido }}\" hint-placeholder-val=\"{{ false }}\">\n          <button onclick=\"{{ onMostrarPainel }}\" title=\"Mostrar painel de contexto\" style=\"position:absolute; top:14px; left:14px; display:inline-flex; align-items:center; gap:8px; padding:9px 14px; border-radius:999px; border:1px solid #E6DECB; background:rgba(251,248,241,.85); backdrop-filter:blur(8px); cursor:pointer; box-shadow:0 6px 16px rgba(28,38,32,.10); font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.14em; color:#3C4843; text-transform:uppercase; animation:surgir .16s ease\" style-hover=\"border-color:#06492D; color:#06492D\">\n            <svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m13 17 5-5-5-5\"><\u002Fpath><path d=\"m6 17 5-5-5-5\"><\u002Fpath><\u002Fsvg>\n            <span>Painel<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-if>\n\n        <!-- Estado inicial: convite com prévia desfocada ao fundo -->\n        <sc-if value=\"{{ ehInicio }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"position:absolute; inset:0; display:flex; justify-content:center; padding:24px; overflow-y:auto; z-index:32\">\n            <svg viewBox=\"0 0 1200 700\" preserveAspectRatio=\"xMidYMid slice\" style=\"position:absolute; inset:0; width:100%; height:100%; filter:blur(3px); opacity:.5; pointer-events:none\">\n              <g stroke=\"#B4A98D\" stroke-width=\"1.6\" opacity=\".75\">\n                <line x1=\"240\" y1=\"240\" x2=\"420\" y2=\"150\"><\u002Fline>\n                <line x1=\"240\" y1=\"240\" x2=\"390\" y2=\"360\"><\u002Fline>\n                <line x1=\"420\" y1=\"150\" x2=\"640\" y2=\"210\"><\u002Fline>\n                <line x1=\"390\" y1=\"360\" x2=\"640\" y2=\"210\"><\u002Fline>\n                <line x1=\"390\" y1=\"360\" x2=\"560\" y2=\"490\"><\u002Fline>\n                <line x1=\"640\" y1=\"210\" x2=\"850\" y2=\"160\"><\u002Fline>\n                <line x1=\"640\" y1=\"210\" x2=\"820\" y2=\"350\"><\u002Fline>\n                <line x1=\"560\" y1=\"490\" x2=\"820\" y2=\"350\"><\u002Fline>\n                <line x1=\"820\" y1=\"350\" x2=\"1010\" y2=\"270\"><\u002Fline>\n                <line x1=\"820\" y1=\"350\" x2=\"960\" y2=\"500\"><\u002Fline>\n                <line x1=\"240\" y1=\"240\" x2=\"180\" y2=\"430\" stroke-dasharray=\"7 6\"><\u002Fline>\n                <line x1=\"180\" y1=\"430\" x2=\"390\" y2=\"360\" stroke-dasharray=\"7 6\"><\u002Fline>\n              <\u002Fg>\n              <circle cx=\"240\" cy=\"240\" r=\"16\" fill=\"{{ swHab }}\"><\u002Fcircle>\n              <circle cx=\"420\" cy=\"150\" r=\"13\" fill=\"{{ swConc }}\"><\u002Fcircle>\n              <circle cx=\"390\" cy=\"360\" r=\"20\" fill=\"{{ swDisc }}\"><\u002Fcircle>\n              <circle cx=\"640\" cy=\"210\" r=\"15\" fill=\"{{ swHab }}\"><\u002Fcircle>\n              <circle cx=\"560\" cy=\"490\" r=\"13\" fill=\"{{ swConc }}\"><\u002Fcircle>\n              <circle cx=\"820\" cy=\"350\" r=\"17\" fill=\"{{ swHab }}\"><\u002Fcircle>\n              <circle cx=\"850\" cy=\"160\" r=\"12\" fill=\"{{ swDisc }}\"><\u002Fcircle>\n              <circle cx=\"1010\" cy=\"270\" r=\"13\" fill=\"{{ swConc }}\"><\u002Fcircle>\n              <circle cx=\"960\" cy=\"500\" r=\"15\" fill=\"{{ swDisc }}\"><\u002Fcircle>\n              <circle cx=\"180\" cy=\"430\" r=\"12\" fill=\"{{ swHab }}\"><\u002Fcircle>\n            <\u002Fsvg>\n            <div style=\"position:relative; width:640px; max-width:92%; margin:auto 0; background:#FBF8F1; border:1px solid #E6DECB; border-radius:22px; padding:30px 40px; box-shadow:0 30px 70px rgba(28,38,32,.14); animation:surgir .2s ease; flex:none; height:fit-content\">\n              <div style=\"display:flex; align-items:center; gap:10px; margin-bottom:14px\">\n                <span style=\"width:7px; height:7px; border-radius:50%; background:#8C3E18\"><\u002Fspan>\n                <span style=\"font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.18em; color:#5C6660; text-transform:uppercase\">Comece por um recorte<\u002Fspan>\n              <\u002Fdiv>\n              <h1 style=\"font-family:'Spectral',serif; font-weight:700; font-size:30px; line-height:1.12; letter-spacing:-.015em; margin:0 0 10px\">Escolha sua série e sua matéria<\u002Fh1>\n              <p style=\"font-size:15px; line-height:1.6; color:#5C6660; margin:0 0 24px\">Selecione um ou os dois critérios e clique em <strong style=\"color:#06492D\">Filtrar<\u002Fstrong> — o grafo mostra como as habilidades de computação se conectam às matérias que você já ensina.<\u002Fp>\n              <div style=\"display:flex; flex-direction:column; gap:16px\">\n                <div>\n                  <div style=\"font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:.16em; color:#9A958A; text-transform:uppercase; margin-bottom:8px\">Série<\u002Fdiv>\n                  <div style=\"display:flex; flex-wrap:wrap; gap:8px\">\n                    <sc-for list=\"{{ convAnos }}\" as=\"c\" hint-placeholder-count=\"5\">\n                      <button onclick=\"{{ c.onClick }}\" style=\"padding:9px 16px; border-radius:999px; border:1px solid {{ c.borda }}; background:{{ c.bg }}; font-family:'Figtree',system-ui,sans-serif; font-size:14px; font-weight:600; color:{{ c.cor }}; cursor:pointer\" style-hover=\"border-color:#06492D\">{{ c.label }}<\u002Fbutton>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div>\n                  <div style=\"font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:.16em; color:#9A958A; text-transform:uppercase; margin-bottom:8px\">Matéria que você ensina<\u002Fdiv>\n                  <div style=\"display:flex; flex-wrap:wrap; gap:8px\">\n                    <sc-for list=\"{{ convDisc }}\" as=\"c\" hint-placeholder-count=\"8\">\n                      <button onclick=\"{{ c.onClick }}\" style=\"padding:8px 14px; border-radius:999px; border:1px solid {{ c.borda }}; background:{{ c.bg }}; font-family:'Figtree',system-ui,sans-serif; font-size:13.5px; font-weight:500; color:{{ c.cor }}; cursor:pointer\" style-hover=\"border-color:#06492D\">{{ c.label }}<\u002Fbutton>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div>\n                  <div style=\"font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:.16em; color:#9A958A; text-transform:uppercase; margin-bottom:8px\">Ou por conceito de computação<\u002Fdiv>\n                  <div style=\"display:flex; flex-wrap:wrap; gap:8px\">\n                    <sc-for list=\"{{ convConc }}\" as=\"c\" hint-placeholder-count=\"6\">\n                      <button onclick=\"{{ c.onClick }}\" style=\"padding:8px 14px; border-radius:999px; border:1px solid {{ c.borda }}; background:{{ c.bg }}; font-family:'Figtree',system-ui,sans-serif; font-size:13.5px; font-weight:500; color:{{ c.cor }}; cursor:pointer\" style-hover=\"border-color:#06492D\">{{ c.label }}<\u002Fbutton>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex; align-items:center; gap:12px; margin-top:26px; flex-wrap:wrap\">\n                <button onclick=\"{{ onFiltrar }}\" style=\"display:inline-flex; align-items:center; gap:9px; padding:12px 28px; border-radius:999px; border:none; background:#06492D; color:#F7F2E8; font-family:'Figtree',system-ui,sans-serif; font-size:15px; font-weight:700; cursor:pointer; opacity:{{ convFiltrarOpacidade }}\" style-hover=\"background:#053C24\">\n                  <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#F7F2E8\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 5h16l-6.5 8v5.5L10.5 20v-7z\"><\u002Fpath><\u002Fsvg>\n                  <span>Filtrar<\u002Fspan>\n                <\u002Fbutton>\n                <sc-if value=\"{{ prevTem }}\" hint-placeholder-val=\"{{ false }}\">\n                  <span title=\"Vértices que a consulta vai retornar\" style=\"font-family:'JetBrains Mono',monospace; font-size:11.5px; color:#06492D; background:#EAF2EC; border:1px solid #CFE0D4; border-radius:999px; padding:7px 13px; white-space:nowrap; animation:surgir .14s ease\">{{ prevQtd }} vértices<\u002Fspan>\n                <\u002Fsc-if>\n                <span style=\"font-size:12.5px; color:#9A958A\">{{ convResumo }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- Carregando: esqueleto de nós pulsando -->\n        <sc-if value=\"{{ ehCarregando }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"position:absolute; inset:0; background:rgba(243,237,223,.82); z-index:32\">\n            <sc-for list=\"{{ skeletonPontos }}\" as=\"sk\" hint-placeholder-count=\"0\">\n              <span style=\"position:absolute; left:{{ sk.l }}%; top:{{ sk.t }}%; width:{{ sk.d }}px; height:{{ sk.d }}px; border-radius:50%; background:#B4A98D; animation:pulsar 1.3s ease-in-out {{ sk.delay }}s infinite\"><\u002Fspan>\n            <\u002Fsc-for>\n            <div style=\"position:absolute; left:50%; bottom:64px; transform:translateX(-50%); display:flex; align-items:center; gap:10px; background:#FBF8F1; border:1px solid #E6DECB; border-radius:999px; padding:9px 18px; box-shadow:0 10px 26px rgba(28,38,32,.10)\">\n              <div style=\"width:15px; height:15px; border-radius:50%; border:2.5px solid #E6DECB; border-top-color:#06492D; animation:girar .8s linear infinite\"><\u002Fdiv>\n              <span style=\"font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.12em; color:#3C4843; text-transform:uppercase\">Consultando endpoint SPARQL…<\u002Fspan>\n              <span style=\"font-size:11px; color:#9A958A\">Apache Jena Fuseki<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- Erro -->\n        <sc-if value=\"{{ ehErro }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:24px; z-index:32\">\n            <div style=\"width:460px; max-width:92%; background:#FBF8F1; border:1px solid #E0B9A8; border-radius:18px; padding:28px 30px; box-shadow:0 24px 60px rgba(28,38,32,.14); animation:surgir .18s ease\">\n              <div style=\"display:flex; align-items:center; gap:10px; margin-bottom:12px\">\n                <span style=\"width:8px; height:8px; border-radius:50%; background:#8C3E18\"><\u002Fspan>\n                <span style=\"font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.16em; color:#8C3E18; text-transform:uppercase\">Falha na consulta<\u002Fspan>\n              <\u002Fdiv>\n              <h2 style=\"font-family:'Spectral',serif; font-weight:700; font-size:22px; margin:0 0 8px\">Não foi possível consultar o grafo<\u002Fh2>\n              <p style=\"font-family:'JetBrains Mono',monospace; font-size:11.5px; line-height:1.6; color:#5C6660; margin:0 0 20px; background:#F7F2E8; border:1px dashed #E6DECB; border-radius:10px; padding:10px 12px\">{{ msgErro }}<\u002Fp>\n              <div style=\"display:flex; gap:10px\">\n                <button onclick=\"{{ onTentarNovamente }}\" style=\"padding:10px 20px; border-radius:999px; border:none; background:#06492D; color:#F7F2E8; font-family:'Figtree',system-ui,sans-serif; font-size:14px; font-weight:600; cursor:pointer\" style-hover=\"background:#053C24\">Tentar novamente<\u002Fbutton>\n                <button onclick=\"{{ onLimpar }}\" style=\"padding:10px 18px; border-radius:999px; border:1px solid #E6DECB; background:transparent; color:#3C4843; font-family:'Figtree',system-ui,sans-serif; font-size:14px; font-weight:500; cursor:pointer\" style-hover=\"border-color:#06492D; color:#06492D\">Voltar ao início<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- Vazio -->\n        <sc-if value=\"{{ ehVazio }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:24px; z-index:32\">\n            <div style=\"width:440px; max-width:92%; background:#FBF8F1; border:1px solid #E6DECB; border-radius:18px; padding:28px 30px; box-shadow:0 24px 60px rgba(28,38,32,.12); text-align:left; animation:surgir .18s ease\">\n              <div style=\"display:flex; align-items:center; gap:10px; margin-bottom:12px\">\n                <span style=\"width:8px; height:8px; border-radius:50%; background:#C9A227\"><\u002Fspan>\n                <span style=\"font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.16em; color:#5C6660; text-transform:uppercase\">Sem resultados<\u002Fspan>\n              <\u002Fdiv>\n              <h2 style=\"font-family:'Spectral',serif; font-weight:700; font-size:22px; margin:0 0 8px\">Nenhuma conexão neste recorte<\u002Fh2>\n              <p style=\"font-size:14px; line-height:1.6; color:#5C6660; margin:0 0 20px\">A combinação de série e matéria não retornou habilidades. Tente ampliar o recorte — trocar a matéria ou liberar a série.<\u002Fp>\n              <button onclick=\"{{ onLimpar }}\" style=\"padding:10px 20px; border-radius:999px; border:none; background:#06492D; color:#F7F2E8; font-family:'Figtree',system-ui,sans-serif; font-size:14px; font-weight:600; cursor:pointer\" style-hover=\"background:#053C24\">Limpar filtros<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ══ Footer (aparece ao rolar a página) ══ -->\n  <footer style=\"background:#EFE8DA; border-top:1px solid #E6DECB; padding:54px 32px\">\n    <div style=\"max-width:1040px; margin:0 auto; display:flex; align-items:flex-start; justify-content:space-between; gap:40px; flex-wrap:wrap\">\n      <div style=\"max-width:320px\">\n        <div style=\"display:flex; align-items:center; gap:10px; margin-bottom:14px\">\n          <svg viewBox=\"0 0 150 120\" width=\"33\" height=\"26\" fill=\"none\" aria-hidden=\"true\">\n            <path d=\"M33 47L64 46M64 46L80 74M80 74L64 100M64 100L34 101M34 101L18 74M18 74L33 47M49 74L33 47M49 74L64 46M49 74L80 74M49 74L64 100M49 74L34 101M49 74L18 74M64 46L101 20M101 20L132 44\" stroke=\"#06492D\" stroke-width=\"3\" stroke-opacity=\".4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n            <circle cx=\"33\" cy=\"47\" r=\"8\" fill=\"#C9A227\"><\u002Fcircle>\n            <circle cx=\"64\" cy=\"46\" r=\"8\" fill=\"#06492D\"><\u002Fcircle>\n            <circle cx=\"80\" cy=\"74\" r=\"8\" fill=\"#053C24\"><\u002Fcircle>\n            <circle cx=\"64\" cy=\"100\" r=\"8\" fill=\"#C9A227\"><\u002Fcircle>\n            <circle cx=\"34\" cy=\"101\" r=\"8\" fill=\"#06492D\"><\u002Fcircle>\n            <circle cx=\"18\" cy=\"74\" r=\"8\" fill=\"#053C24\"><\u002Fcircle>\n            <circle cx=\"49\" cy=\"74\" r=\"9.5\" fill=\"#06492D\"><\u002Fcircle>\n            <circle cx=\"101\" cy=\"20\" r=\"8\" fill=\"#C9A227\"><\u002Fcircle>\n            <circle cx=\"132\" cy=\"44\" r=\"8\" fill=\"#06492D\"><\u002Fcircle>\n          <\u002Fsvg>\n          <span style=\"font-family:'Spectral',serif; font-weight:700; font-size:18px; letter-spacing:-.01em; color:#1C2620\">EduGraph<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0; font-size:14px; line-height:1.55; color:#5C6660\">Grafos da BNCC de Computação para professores da educação básica. Veja o currículo conectado.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex; gap:64px; flex-wrap:wrap\">\n        <div style=\"display:flex; flex-direction:column; gap:12px\">\n          <span style=\"font-family:'JetBrains Mono',monospace; font-weight:600; font-size:12px; letter-spacing:.08em; color:#1C2620; text-transform:uppercase\">Plataforma<\u002Fspan>\n          <a href=\"#\" style=\"font-size:14px; color:#3C4843; text-decoration:none\" style-hover=\"color:#06492D\">Explorar grafos<\u002Fa>\n          <a href=\"#\" style=\"font-size:14px; color:#3C4843; text-decoration:none\" style-hover=\"color:#06492D\">BNCC Computação<\u002Fa>\n          <a href=\"#\" style=\"font-size:14px; color:#3C4843; text-decoration:none\" style-hover=\"color:#06492D\">Criar conta<\u002Fa>\n        <\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:12px\">\n          <span style=\"font-family:'JetBrains Mono',monospace; font-weight:600; font-size:12px; letter-spacing:.08em; color:#1C2620; text-transform:uppercase\">Apoio<\u002Fspan>\n          <a href=\"#\" style=\"font-size:14px; color:#3C4843; text-decoration:none\" style-hover=\"color:#06492D\">Central de ajuda<\u002Fa>\n          <a href=\"#\" style=\"font-size:14px; color:#3C4843; text-decoration:none\" style-hover=\"color:#06492D\">Para escolas<\u002Fa>\n          <a href=\"#\" style=\"font-size:14px; color:#3C4843; text-decoration:none\" style-hover=\"color:#06492D\">Contato<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"max-width:1040px; margin:40px auto 0; padding-top:30px; border-top:1px solid #E4DECF; display:flex; align-items:center; gap:26px; flex-wrap:wrap\">\n      <span style=\"font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:#9A958A\">Uma iniciativa de<\u002Fspan>\n      <a href=\"https://labotim.inf.ufes.br\" target=\"_blank\" rel=\"noopener\" title=\"LabOtim · Laboratório de Otimização e Modelagem Computacional\" style=\"display:inline-flex; align-items:center; background:#fff; border:1px solid rgba(28,38,32,.08); border-radius:12px; padding:14px 20px; box-shadow:0 4px 14px -8px rgba(0,0,0,.3)\"><img src=\"c2834271-b7bf-44df-b036-784fed18ecfb\" alt=\"LabOtim · Laboratório de Otimização e Modelagem Computacional\" style=\"height:42px; display:block\"><\u002Fa>\n      <a href=\"https://www.ufes.br\" target=\"_blank\" rel=\"noopener\" title=\"Universidade Federal do Espírito Santo\" style=\"display:inline-flex; align-items:center; justify-content:center; background:#fff; border:1px solid rgba(28,38,32,.08); border-radius:12px; padding:14px 20px; box-shadow:0 4px 14px -8px rgba(0,0,0,.3)\"><img src=\"2eacf721-c980-4fdb-84ec-5fcf355ed316\" alt=\"Universidade Federal do Espírito Santo\" style=\"height:42px; display:block\"><\u002Fa>\n    <\u002Fdiv>\n    <div style=\"max-width:1040px; margin:34px auto 0; padding-top:22px; border-top:1px solid #E4DECF; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap\">\n      <span style=\"font-size:12px; color:#9A958A\">© 2026 EduGraph · Feito para a educação básica<\u002Fspan>\n      <div style=\"display:flex; gap:22px\">\n        <a href=\"#\" style=\"font-size:12px; color:#9A958A; text-decoration:none\" style-hover=\"color:#3C4843\">Privacidade<\u002Fa>\n        <a href=\"#\" style=\"font-size:12px; color:#9A958A; text-decoration:none\" style-hover=\"color:#3C4843\">Termos<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;corHabilidade&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#1B9E77&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Cores do grafo (paleta Padrão)&quot;,&quot;options&quot;:[&quot;#2E6FE8&quot;,&quot;#1B9E77&quot;,&quot;#3949AB&quot;,&quot;#0EA5E9&quot;]},&quot;corConceito&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#7C4DFF&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Cores do grafo (paleta Padrão)&quot;,&quot;options&quot;:[&quot;#9333EA&quot;,&quot;#D81B60&quot;,&quot;#7C4DFF&quot;,&quot;#C026D3&quot;]},&quot;corDisciplina&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#E11D48&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Cores do grafo (paleta Padrão)&quot;,&quot;options&quot;:[&quot;#EA580C&quot;,&quot;#E11D48&quot;,&quot;#F59E0B&quot;,&quot;#16A34A&quot;]},&quot;latenciaMs&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1000,&quot;min&quot;:0,&quot;max&quot;:3000,&quot;step&quot;:100,&quot;unit&quot;:&quot;ms&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Simulação do endpoint&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    status: 'inicio', // inicio | carregando | pronto | vazio | erro\n    filtros: { ano: '', disciplina: '', conceito: '', tipos: { habilidade: true, conceito: true, disciplina: true } },\n    pend: { ano: '', disciplina: '', conceito: '' }, // seleção pendente — aplica no Filtrar\n    busca: '', sugestoes: [],\n    selecionadoId: null, detalhe: null,\n    contagens: { habilidade: 0, conceito: 0, disciplina: 0, conexoes: 0 },\n    tempoMs: 0, consulta: '', msgErro: '',\n    drawer: false, simErro: false, expandindo: false,\n    paleta: 'padrao', paletaAberta: false,\n    formas: false, semAnim: false,\n    vistos: [], desfaziveis: 0,\n    iaMsg: '', iaAviso: false,\n    perfilAberto: false, senhaAviso: false,\n    turmasAberto: false, novaAno: '5', novaDisc: 'matematica',\n    turmas: [ { ano: '7', disciplina: 'matematica' }, { ano: '5', disciplina: 'ciencias' } ],\n    painel: { x: 12, w: 392, esc: false },\n  };\n\n  PALETAS = {\n    protanopia:   { habilidade: '#0C7BDC', conceito: '#FFC20A', disciplina: '#1C2620' },\n    deuteranopia: { habilidade: '#648FFF', conceito: '#FFB000', disciplina: '#DC267F' },\n    tritanopia:   { habilidade: '#D41159', conceito: '#1A85FF', disciplina: '#40405C' },\n  };\n\n  canvasRef = React.createRef();\n  nos = new Map();\n  arestas = [];\n  cam = { x: 0, y: 0, k: 1 };\n  alvoCam = null;\n  alpha = 0;\n  hoverId = null;\n  drag = null; pan = null;\n  seq = 0; pendenteSel = null;\n  histExp = [];\n\n  cv() {\n    let c = this.canvasRef.current;\n    if (c && c.isConnected) return c;\n    if (!this._cv || !this._cv.isConnected) this._cv = document.querySelector('canvas[data-grafo-canvas]');\n    return this._cv;\n  }\n\n  // ── preferências persistentes (conta) ─────────────────────────────────────\n  carregarPrefs() {\n    try {\n      const p = JSON.parse(localStorage.getItem('edugraphPrefs') || '{}');\n      const st = {};\n      if (p.paleta && (p.paleta === 'padrao' || this.PALETAS[p.paleta])) st.paleta = p.paleta;\n      if (typeof p.formas === 'boolean') st.formas = p.formas;\n      if (typeof p.semAnim === 'boolean') st.semAnim = p.semAnim;\n      if (Array.isArray(p.turmas)) st.turmas = p.turmas.filter(t => t && t.ano && t.disciplina);\n      if (p.painel && typeof p.painel === 'object') st.painel = { ...this.state.painel, ...p.painel };\n      if (Object.keys(st).length) this.setState(st);\n    } catch (e) { /* prefs corrompidas: ignora */ }\n  }\n  setPref(patch) {\n    this.setState(patch, () => {\n      try {\n        const s = this.state;\n        localStorage.setItem('edugraphPrefs', JSON.stringify({\n          paleta: s.paleta, formas: s.formas, semAnim: s.semAnim, turmas: s.turmas, painel: s.painel,\n        }));\n      } catch (e) { /* sem storage */ }\n    });\n  }\n\n  // ── ciclo de vida ─────────────────────────────────────────────────────────\n  componentDidMount() { this.iniciar(); }\n  componentWillUnmount() {\n    cancelAnimationFrame(this.raf);\n    if (this.ro) this.ro.disconnect();\n  }\n  componentDidUpdate() {\n    if (this.M) this.M.setConfig({ latencia: this.props.latenciaMs ?? 500, erro: this.state.simErro });\n  }\n\n  async iniciar() {\n    this.M = await import(window.__resources ? window.__resources.mockFuseki : './mock-fuseki.js');\n    this.M.setConfig({ latencia: this.props.latenciaMs ?? 500 });\n    this.uriParaId = new Map([...this.M.NOS.values()].map(n => [n.uri, n.id]));\n    this.carregarPrefs();\n    this.ligarCanvas();\n    this.raf = requestAnimationFrame(this.tick);\n    this.forceUpdate();\n    // Estado do filtro na URL: ?serie=7&disciplina=matematica&conceito=algoritmos\n    const q = new URLSearchParams(location.search);\n    const h = new URLSearchParams((location.hash || '').replace(/^#\\??/, ''));\n    const par = k => q.get(k) || h.get(k) || '';\n    const serie = par('serie') || par('ano');\n    const disciplina = par('disciplina') || par('materia');\n    const conceito = par('conceito');\n    const okSerie = serie && this.M.ANOS.some(a => a.id === serie && a.id !== 'EM') ? serie : '';\n    const okDisc = disciplina && this.M.NOS.has(disciplina) ? disciplina : '';\n    const okConc = conceito && this.M.NOS.has(conceito) ? conceito : '';\n    if (okSerie || okDisc || okConc) {\n      this.aplicarFiltros({ ...this.state.filtros, ano: okSerie, disciplina: okDisc, conceito: okConc });\n    }\n  }\n\n  cores() {\n    if (this.state.paleta !== 'padrao' && this.PALETAS[this.state.paleta]) return this.PALETAS[this.state.paleta];\n    return {\n      habilidade: this.props.corHabilidade ?? '#1B9E77',\n      conceito:   this.props.corConceito   ?? '#7C4DFF',\n      disciplina: this.props.corDisciplina ?? '#E11D48',\n    };\n  }\n\n  sincronizarURL(f) {\n    try {\n      const u = new URL(location.href);\n      u.searchParams.delete('serie'); u.searchParams.delete('ano');\n      u.searchParams.delete('disciplina'); u.searchParams.delete('materia');\n      u.searchParams.delete('conceito');\n      if (f.ano) u.searchParams.set('serie', f.ano);\n      if (f.disciplina) u.searchParams.set('disciplina', f.disciplina);\n      if (f.conceito) u.searchParams.set('conceito', f.conceito);\n      history.replaceState(null, '', u.toString());\n    } catch (e) { /* ambientes sem history */ }\n  }\n\n  // ── prévia de vértices do recorte pendente ────────────────────────────────\n  contarVertices(p) {\n    if (!this.M || (!p.ano && !p.disciplina && !p.conceito)) return 0;\n    const t = this.state.filtros.tipos;\n    const habs = this.M.LISTA_HABILIDADES.filter(hb =>\n      hb.ano !== 'EM' || p.ano !== '' ? (\n        (!p.ano || hb.ano === p.ano) &&\n        (!p.disciplina || hb.disc.includes(p.disciplina)) &&\n        (!p.conceito || hb.conceitos.includes(p.conceito))\n      ) : false\n    );\n    const concs = new Set(), discs = new Set();\n    habs.forEach(hb => {\n      hb.conceitos.forEach(c => concs.add(c));\n      hb.disc.forEach(d => discs.add(d));\n    });\n    return (t.habilidade !== false ? habs.length : 0)\n      + (t.conceito !== false ? concs.size : 0)\n      + (t.disciplina !== false ? discs.size : 0);\n  }\n\n  // ── consulta principal (recorte) ──────────────────────────────────────────\n  aplicarFiltros(filtros) {\n    this.sincronizarURL(filtros);\n    const pend = { ano: filtros.ano, disciplina: filtros.disciplina, conceito: filtros.conceito };\n    const vazio = !filtros.ano && !filtros.disciplina && !filtros.conceito;\n    this.histExp = [];\n    if (vazio) {\n      this.nos.clear(); this.arestas = [];\n      this.setState({ filtros, pend, status: 'inicio', selecionadoId: null, detalhe: null, consulta: '', desfaziveis: 0 });\n      return;\n    }\n    const params = {\n      ano: filtros.ano, eixo: '',\n      disciplina: filtros.disciplina, conceito: filtros.conceito,\n      componentes: [],\n      tipos: filtros.tipos,\n    };\n    const consulta = this.M.construirConsultaGrafo(params);\n    const meuSeq = ++this.seq;\n    this.setState({ filtros, pend, status: 'carregando', consulta, msgErro: '', desfaziveis: 0 });\n    this.M.consultarFuseki('grafo', params).then(({ json, ms }) => {\n      if (meuSeq !== this.seq) return;\n      this.construirGrafo(json, ms);\n    }).catch(err => {\n      if (meuSeq !== this.seq) return;\n      this.setState({ status: 'erro', msgErro: String(err.message || err) });\n    });\n  }\n\n  construirGrafo(json, ms) {\n    const antigos = this.nos;\n    const novos = new Map();\n    const arestas = [];\n    const vistosAr = new Set();\n    let idx = 0;\n    const garantir = (id) => {\n      if (novos.has(id)) return novos.get(id);\n      const base = this.M.NOS.get(id);\n      const velho = antigos.get(id);\n      const raio = base.tipo === 'disciplina' ? 17 : base.tipo === 'conceito' ? 14 : 11;\n      const angulo = (idx++) * 2.399963;\n      const dist = base.tipo === 'habilidade' ? 70 + (idx % 5) * 38 : base.tipo === 'conceito' ? 230 : 330;\n      const no = {\n        id, tipo: base.tipo, label: base.label, resumo: base.resumo || '', ano: base.ano || '',\n        x: velho ? velho.x : Math.cos(angulo) * dist + (Math.random() - .5) * 30,\n        y: velho ? velho.y : Math.sin(angulo) * dist + (Math.random() - .5) * 30,\n        vx: 0, vy: 0, r: raio,\n      };\n      novos.set(id, no);\n      return no;\n    };\n    json.results.bindings.forEach(b => {\n      const a = this.uriParaId.get(b.origem.value);\n      const c = this.uriParaId.get(b.destino.value);\n      if (!a || !c) return;\n      garantir(a); garantir(c);\n      const rel = b.relacao.value.replace('edu:', '');\n      const chave = a + '|' + rel + '|' + c;\n      if (vistosAr.has(chave)) return;\n      vistosAr.add(chave);\n      arestas.push({ a, b: c, rel });\n    });\n    (json.nosIsolados || []).forEach(id => garantir(id));\n    this.nos = novos; this.arestas = arestas;\n    const cont = { habilidade: 0, conceito: 0, disciplina: 0, conexoes: arestas.length };\n    novos.forEach(n => cont[n.tipo]++);\n    const selOk = this.state.selecionadoId && novos.has(this.state.selecionadoId);\n    this.setState({\n      status: novos.size === 0 ? 'vazio' : 'pronto',\n      contagens: cont, tempoMs: ms,\n      selecionadoId: selOk ? this.state.selecionadoId : null,\n      detalhe: selOk ? this.state.detalhe : null,\n    });\n    this.alpha = 1;\n    if (this.state.semAnim) this.assentar(260);\n    clearTimeout(this.tEnquadrar);\n    this.tEnquadrar = setTimeout(() => {\n      this.enquadrar();\n      if (this.pendenteSel && this.nos.has(this.pendenteSel)) {\n        const alvo = this.pendenteSel; this.pendenteSel = null;\n        setTimeout(() => { this.selecionar(alvo); this.centrarEm(alvo); }, this.state.semAnim ? 40 : 350);\n      }\n    }, this.state.semAnim ? 40 : 420);\n  }\n\n  // assenta o layout de imediato (modo sem animações)\n  assentar(iteracoes) {\n    this.alpha = 1;\n    for (let i = 0; i = 'carregando',\n      ehErro: st.status === 'erro',\n      ehVazio: st.status === 'vazio',\n      msgErro: st.msgErro,\n      skeletonPontos,\n      onTentarNovamente: () => this.aplicarFiltros({ ...F }),\n      // palco\n      mostrarResumo: st.status === 'pronto',\n      resumoRecorte,\n      mostrarLegenda: st.status === 'pronto' || st.status === 'vazio',\n      legenda,\n      onZoomMais: () => { this.alvoCam = { x: this.cam.x, y: this.cam.y, k: Math.min(3, this.cam.k * 1.35) }; },\n      onZoomMenos: () => { this.alvoCam = { x: this.cam.x, y: this.cam.y, k: Math.max(0.18, this.cam.k / 1.35) }; },\n      onRecentrar: () => this.enquadrar(),\n      // desfazer expansão\n      podeDesfazer: st.desfaziveis > 0 && st.status === 'pronto',\n      desfazerQtd: '×' + st.desfaziveis,\n      onDesfazer: () => this.desfazerExpansao(),\n      // paleta\n      paletaAberta: st.paletaAberta,\n      onTogglePaleta: () => this.setState({ paletaAberta: !st.paletaAberta }),\n      paletaBotaoBorda: (st.paleta !== 'padrao' || st.formas || st.semAnim) ? '#06492D' : '#E6DECB',\n      swHab: C.habilidade, swConc: C.conceito, swDisc: C.disciplina,\n      paletas,\n      // convite\n      convAnos, convDisc, convConc,\n      // gaveta SPARQL\n      drawerAberto: st.drawer,\n      onToggleDrawer: () => this.setState({ drawer: !st.drawer }),\n      drawerCorPonto: st.simErro ? '#8C3E18' : '#06492D',\n      consultaTexto: st.consulta || '# Nenhuma consulta executada ainda.\\n# Escolha um recorte e clique em Filtrar.',\n      tempoLabel: st.tempoMs ? st.tempoMs + ' ms' : '',\n      simErro: st.simErro,\n      onSimErro: (e) => this.setState({ simErro: e.target.checked }),\n      // painel flutuante\n      painelVisivel: !st.painel.esc,\n      painelEscondido: st.painel.esc,\n      painelX: st.painel.x, painelW: st.painel.w,\n      onEsconderPainel: () => this.setPainel({ esc: true }),\n      onMostrarPainel: () => this.setPainel({ esc: false }),\n      onPainelDrag: this.iniciarArrastoPainel,\n      onPainelResize: this.iniciarResizePainel,\n      // painel: conteúdo\n      temSelecao: !!sel, semSelecao: !sel, sel: sel || {},\n      onFechar: () => this.setState({ selecionadoId: null, detalhe: null }),\n      onExpandir: () => this.expandir(st.selecionadoId),\n      expandLabel: st.expandindo ? 'Expandindo…' : 'Expandir conexões deste nó',\n      // vistos por último\n      temVistos: vistosUI.length > 0, vistosUI,\n      // assistente IA\n      iaMsg: st.iaMsg,\n      onIaChange: (e) => this.setState({ iaMsg: e.target.value }),\n      onIaTecla: (e) => { if (e.key === 'Enter') this.setState({ iaAviso: true }); },\n      onIaEnviar: () => this.setState({ iaAviso: true }),\n      iaAviso: st.iaAviso,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
