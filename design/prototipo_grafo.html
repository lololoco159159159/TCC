document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

h; display:flex; flex-direction:column; overflow:hidden\">\n\n    <!-- ── Header (versão logada) ── -->\n    <header style=\"flex:none; display:flex; align-items:center; gap:24px; height:60px; padding:0 26px; border-bottom:1px solid #D8CEB8; background:#F7F2E8; z-index:50\">\n      <div style=\"display:flex; align-items:center; gap:10px; flex:none\">\n        <svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\">\n          <circle cx=\"5\" cy=\"17\" r=\"2.6\" fill=\"#06492D\"><\u002Fcircle>\n          <circle cx=\"12\" cy=\"6\" r=\"2.2\" fill=\"#06492D\"><\u002Fcircle>\n          <circle cx=\"19\" cy=\"14\" r=\"1.9\" fill=\"#8C3E18\"><\u002Fcircle>\n          <circle cx=\"15\" cy=\"20\" r=\"1.5\" fill=\"#06492D\" opacity=\"0.55\"><\u002Fcircle>\n          <line x1=\"5\" y1=\"17\" x2=\"12\" y2=\"6\" stroke=\"#06492D\" stroke-width=\"1.1\" opacity=\"0.4\"><\u002Fline>\n          <line x1=\"12\" y1=\"6\" x2=\"19\" y2=\"14\" stroke=\"#06492D\" stroke-width=\"1.1\" opacity=\"0.4\"><\u002Fline>\n          <line x1=\"19\" y1=\"14\" x2=\"15\" y2=\"20\" stroke=\"#06492D\" stroke-width=\"1.1\" opacity=\"0.4\"><\u002Fline>\n        <\u002Fsvg>\n        <span style=\"font-family:'Spectral',serif; font-weight:700; font-size:19px; letter-spacing:-.01em\">EduGraph<\u002Fspan>\n      <\u002Fdiv>\n      <nav style=\"display:flex; align-items:center; gap:20px; font-size:14.5px; font-weight:500; color:#5C6660\">\n        <a href=\"#\" style=\"color:#06492D; font-weight:700; text-decoration:none; border-bottom:2px solid #06492D; padding:19px 0 17px\">Grafos<\u002Fa>\n        <a href=\"#\" style=\"color:inherit; text-decoration:none\" style-hover=\"color:#1C2620\">BNCC<\u002Fa>\n        <a href=\"#\" style=\"color:inherit; text-decoration:none\" style-hover=\"color:#1C2620\">Para escolas<\u002Fa>\n        <a href=\"#\" style=\"color:inherit; text-decoration:none\" style-hover=\"color:#1C2620\">Ajuda<\u002Fa>\n      <\u002Fnav>\n      <div style=\"flex:1\"><\u002Fdiv>\n      <div style=\"display:flex; align-items:center; gap:10px; flex:none\">\n        <a href=\"https://labotim.inf.ufes.br\" target=\"_blank\" rel=\"noopener\" title=\"LabOtim · Laboratório de Otimização e Modelagem Computacional\" style=\"display:inline-flex; align-items:center; background:#FFFFFF; border:1px solid rgba(28,38,32,.08); border-radius:9px; padding:5px 10px; box-shadow:0 2px 7px -4px rgba(0,0,0,.25)\"><img src=\"c2834271-b7bf-44df-b036-784fed18ecfb\" alt=\"LabOtim\" style=\"height:22px; display:block\"><\u002Fa>\n        <a href=\"https://www.ufes.br\" target=\"_blank\" rel=\"noopener\" title=\"Universidade Federal do Espírito Santo\" style=\"display:inline-flex; align-items:center; background:#FFFFFF; border:1px solid rgba(28,38,32,.08); border-radius:9px; padding:5px 10px; box-shadow:0 2px 7px -4px rgba(0,0,0,.25)\"><img src=\"2eacf721-c980-4fdb-84ec-5fcf355ed316\" alt=\"UFES\" style=\"height:22px; display:block\"><\u002Fa>\n      <\u002Fdiv>\n      <span style=\"width:1px; height:26px; background:#E6DECB; flex:none\"><\u002Fspan>\n\n      <!-- Perfil logado -->\n      <button onclick=\"{{ onTogglePerfil }}\" title=\"Minha conta\" style=\"display:inline-flex; align-items:center; gap:9px; padding:5px 12px 5px 5px; border-radius:999px; border:1px solid {{ perfilBorda }}; background:#FBF8F1; cursor:pointer; font-family:'Figtree',system-ui,sans-serif; flex:none\" style-hover=\"border-color:#06492D\">\n        <span style=\"width:30px; height:30px; border-radius:50%; background:#06492D; color:#F7F2E8; display:inline-flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; letter-spacing:.03em\">MS<\u002Fspan>\n        <span style=\"font-size:13.5px; font-weight:600; color:#1C2620\">Profa. Mariana<\u002Fspan>\n        <svg width=\"11\" height=\"11\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#5C6660\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m6 9 6 6 6-6\"><\u002Fpath><\u002Fsvg>\n      <\u002Fbutton>\n\n      <sc-if value=\"{{ perfilAberto }}\" hint-placeholder-val=\"{{ false }}\">\n        <div onclick=\"{{ onFecharPerfil }}\" style=\"position:fixed; inset:0; z-index:190\"><\u002Fdiv>\n        <div style=\"position:fixed; top:66px; right:20px; width:368px; max-height:calc(100vh - 92px); overflow-y:auto; background:#FBF8F1; border:1px solid #E6DECB; border-radius:18px; box-shadow:0 30px 70px rgba(28,38,32,.24); z-index:200; animation:surgir .16s ease; padding:20px 20px 18px\">\n\n          <!-- identidade -->\n          <div style=\"display:flex; align-items:center; gap:13px; margin-bottom:14px\">\n            <span style=\"width:46px; height:46px; border-radius:50%; background:#06492D; color:#F7F2E8; display:inline-flex; align-items:center; justify-content:center; font-size:16px; font-weight:700; letter-spacing:.03em; flex:none\">MS<\u002Fspan>\n            <div style=\"min-width:0\">\n              <div style=\"font-family:'Spectral',serif; font-weight:700; font-size:18px; color:#1C2620; line-height:1.15\">Profa. Mariana Souza<\u002Fdiv>\n              <div style=\"font-size:12.5px; color:#5C6660; overflow:hidden; text-overflow:ellipsis; white-space:nowrap\">mariana.souza@prof.edu.es.gov.br<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <button onclick=\"{{ onAlterarSenha }}\" style=\"display:inline-flex; align-items:center; gap:7px; padding:7px 13px; border-radius:999px; border:1px solid #E6DECB; background:transparent; color:#3C4843; font-family:'Figtree',system-ui,sans-serif; font-size:12.5px; font-weight:600; cursor:pointer\" style-hover=\"border-color:#06492D; color:#06492D\">\n            <svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"11\" width=\"18\" height=\"11\" rx=\"2\"><\u002Frect><path d=\"M7 11V7a5 5 0 0 1 10 0v4\"><\u002Fpath><\u002Fsvg>\n            <span>Alterar senha<\u002Fspan>\n          <\u002Fbutton>\n          <sc-if value=\"{{ senhaAviso }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"margin:8px 0 0; font-size:11.5px; line-height:1.5; color:#9A958A; animation:surgir .16s ease\">O fluxo de troca de senha chega junto com o sistema de contas (em desenvolvimento).<\u002Fp>\n          <\u002Fsc-if>\n\n          <!-- turmas -->\n          <div style=\"border-top:1px solid #E6DECB; margin-top:16px; padding-top:14px\">\n            <div style=\"font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:.16em; color:#9A958A; text-transform:uppercase; margin-bottom:9px\">Minhas turmas<\u002Fdiv>\n            <div style=\"display:flex; flex-direction:column; gap:5px; margin-bottom:11px\">\n              <sc-for list=\"{{ turmasUI }}\" as=\"t\" hint-placeholder-count=\"2\">\n                <div style=\"display:flex; align-items:center; gap:9px; padding:8px 10px; border:1px solid #E6DECB; border-radius:11px; background:#F7F2E8\">\n                  <svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#06492D\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none\"><path d=\"M22 10 12 5 2 10l10 5z\"><\u002Fpath><path d=\"M6 12v5c3 3 9 3 12 0v-5\"><\u002Fpath><\u002Fsvg>\n                  <span style=\"flex:1; min-width:0; font-size:13px; font-weight:600; color:#1C2620; overflow:hidden; text-overflow:ellipsis; white-space:nowrap\">{{ t.label }}<\u002Fspan>\n                  <button onclick=\"{{ t.onFiltrar }}\" title=\"Filtrar o grafo por esta turma\" style=\"display:inline-flex; align-items:center; gap:5px; padding:5px 10px; border-radius:999px; border:none; background:#06492D; color:#F7F2E8; font-family:'Figtree',system-ui,sans-serif; font-size:11.5px; font-weight:700; cursor:pointer; flex:none\" style-hover=\"background:#053C24\">\n                    <svg width=\"10\" height=\"10\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#F7F2E8\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 5h16l-6.5 8v5.5L10.5 20v-7z\"><\u002Fpath><\u002Fsvg>\n                    <span>Filtrar<\u002Fspan>\n                  <\u002Fbutton>\n                  <button onclick=\"{{ t.onRemover }}\" title=\"Remover turma\" style=\"width:24px; height:24px; border-radius:7px; border:1px solid transparent; background:transparent; color:#9A958A; font-size:14px; line-height:1; cursor:pointer; font-family:'Figtree',system-ui,sans-serif; flex:none\" style-hover=\"color:#8C3E18; border-color:#E0B9A8\">×<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex; gap:6px\">\n              <select value=\"{{ novaAno }}\" onchange=\"{{ onNovaAno }}\" style=\"flex:1; min-width:0; padding:7px 8px; border:1px solid #E6DECB; border-radius:9px; background:#F7F2E8; font-family:'Figtree',system-ui,sans-serif; font-size:12.5px; font-weight:500; color:#3C4843; cursor:pointer; outline:none; appearance:auto\">\n                \n                  <option value=\"{{ o.id }}\">{{ o.label }}<\u002Foption>\n                \n              <\u002Fselect>\n              <select value=\"{{ novaDisc }}\" onchange=\"{{ onNovaDisc }}\" style=\"flex:1.3; min-width:0; padding:7px 8px; border:1px solid #E6DECB; border-radius:9px; background:#F7F2E8; font-family:'Figtree',system-ui,sans-serif; font-size:12.5px; font-weight:500; color:#3C4843; cursor:pointer; outline:none; appearance:auto\">\n                \n                  <option value=\"{{ m.id }}\">{{ m.label }}<\u002Foption>\n                \n              <\u002Fselect>\n              <button onclick=\"{{ onAddTurma }}\" title=\"Adicionar turma\" style=\"padding:7px 13px; border-radius:9px; border:1.5px solid #06492D; background:transparent; color:#06492D; font-family:'Figtree',system-ui,sans-serif; font-size:12.5px; font-weight:700; cursor:pointer; flex:none\" style-hover=\"background:#EAF2EC\">+ Adicionar<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- acessibilidade -->\n          <div style=\"border-top:1px solid #E6DECB; margin-top:16px; padding-top:14px\">\n            <div style=\"font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:.16em; color:#9A958A; text-transform:uppercase; margin-bottom:9px\">Acessibilidade · cores do grafo<\u002Fdiv>\n            <div style=\"display:flex; flex-direction:column; gap:4px; margin-bottom:12px\">\n              <sc-for list=\"{{ paletas }}\" as=\"pl\" hint-placeholder-count=\"4\">\n                <button onclick=\"{{ pl.onPick }}\" style=\"display:flex; align-items:center; gap:9px; width:100%; padding:7px 9px; border:1px solid {{ pl.borda }}; background:{{ pl.bg }}; border-radius:10px; cursor:pointer; font-family:'Figtree',system-ui,sans-serif; text-align:left\" style-hover=\"border-color:#06492D\">\n                  <span style=\"display:inline-flex; gap:3px; flex:none\">\n                    <span style=\"width:10px; height:10px; border-radius:50%; background:{{ pl.c1 }}\"><\u002Fspan>\n                    <span style=\"width:10px; height:10px; border-radius:50%; background:{{ pl.c2 }}\"><\u002Fspan>\n                    <span style=\"width:10px; height:10px; border-radius:50%; background:{{ pl.c3 }}\"><\u002Fspan>\n                  <\u002Fspan>\n                  <span style=\"flex:1; min-width:0\">\n                    <span style=\"display:block; font-size:12.5px; font-weight:700; color:#1C2620\">{{ pl.nome }}<\u002Fspan>\n                    <span style=\"display:block; font-size:10.5px; color:#9A958A\">{{ pl.sub }}<\u002Fspan>\n                  <\u002Fspan>\n                  <span style=\"font-size:12px; color:#06492D; font-weight:700; opacity:{{ pl.checkOp }}\">✓<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <button onclick=\"{{ onToggleFormas }}\" style=\"display:flex; align-items:center; gap:10px; width:100%; padding:8px 9px; border:none; background:transparent; border-radius:10px; cursor:pointer; font-family:'Figtree',system-ui,sans-serif; text-align:left\" style-hover=\"background:#F3EDDF\">\n              <span style=\"flex:1; min-width:0\">\n                <span style=\"display:block; font-size:12.5px; font-weight:700; color:#1C2620\">Formas em vez de cores<\u002Fspan>\n                <span style=\"display:block; font-size:10.5px; color:#9A958A\">daltonismo total: bola, quadrado e triângulo<\u002Fspan>\n              <\u002Fspan>\n              <span style=\"width:34px; height:20px; border-radius:999px; background:{{ formasBg }}; position:relative; flex:none; transition:background .15s\">\n                <span style=\"position:absolute; top:2px; left:{{ formasKnob }}px; width:16px; height:16px; border-radius:50%; background:#FFFFFF; box-shadow:0 1px 3px rgba(0,0,0,.3); transition:left .15s\"><\u002Fspan>\n              <\u002Fspan>\n            <\u002Fbutton>\n            <button onclick=\"{{ onToggleSemAnim }}\" style=\"display:flex; align-items:center; gap:10px; width:100%; padding:8px 9px; border:none; background:transparent; border-radius:10px; cursor:pointer; font-family:'Figtree',system-ui,sans-serif; text-align:left\" style-hover=\"background:#F3EDDF\">\n              <span style=\"flex:1; min-width:0\">\n                <span style=\"display:block; font-size:12.5px; font-weight:700; color:#1C2620\">Desativar animações e física<\u002Fspan>\n                <span style=\"display:block; font-size:10.5px; color:#9A958A\">o grafo assenta de imediato, sem movimento<\u002Fspan>\n              <\u002Fspan>\n              <span style=\"width:34px; height:20px; border-radius:999px; background:{{ semAnimBg }}; position:relative; flex:none; transition:background .15s\">\n                <span style=\"position:absolute; top:2px; left:{{ semAnimKnob }}px; width:16px; height:16px; border-radius:50%; background:#FFFFFF; box-shadow:0 1px 3px rgba(0,0,0,.3); transition:left .15s\"><\u002Fspan>\n              <\u002Fspan>\n            <\u002Fbutton>\n            <p style=\"margin:8px 0 0; font-size:11px; line-height:1.5; color:#9A958A\">Preferências salvas na sua conta e aplicadas em todas as visitas.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fheader>\n\n    <!-- ── Barra de busca e filtros (selecione e clique em Filtrar) ── -->\n    <div style=\"flex:none; display:flex; align-items:center; gap:11px; flex-wrap:wrap; padding:11px 26px; background:#FBF8F1; border-bottom:1px solid #E6DECB; position:relative; z-index:40\">\n\n      <div style=\"position:relative; width:250px; flex:none\">\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#9A958A\" stroke-width=\"2.4\" style=\"position:absolute; left:13px; top:50%; transform:translateY(-50%); pointer-events:none\">\n          <circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle>\n          <line x1=\"16.5\" y1=\"16.5\" x2=\"21\" y2=\"21\"><\u002Fline>\n        <\u002Fsvg>\n        <input type=\"text\" value=\"{{ busca }}\" onchange=\"{{ onBusca }}\" onkeydown=\"{{ onBuscaTecla }}\" onblur=\"{{ onBuscaSair }}\" placeholder=\"Buscar habilidade, matéria, conceito…\" style=\"width:100%; padding:9px 14px 9px 36px; border:1px solid #E6DECB; border-radius:999px; background:#F7F2E8; font-family:'Figtree',system-ui,sans-serif; font-size:13.5px; color:#1C2620; outline:none\" style-focus=\"border-color:#06492D; background:#FFFFFF\">\n        <sc-if value=\"{{ temSugestoes }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"position:absolute; top:42px; left:0; right:-110px; background:#FFFFFF; border:1px solid #E6DECB; border-radius:14px; box-shadow:0 18px 44px rgba(28,38,32,.14); overflow:hidden; animation:surgir .14s ease; z-index:60\">\n            <sc-for list=\"{{ sugestoes }}\" as=\"s\" hint-placeholder-count=\"0\">\n              <button onmousedown=\"{{ s.onPick }}\" style=\"display:flex; align-items:center; gap:10px; width:100%; padding:9px 14px; border:none; background:transparent; cursor:pointer; text-align:left; font-family:'Figtree',system-ui,sans-serif\" style-hover=\"background:#F7F2E8\">\n                <span style=\"width:9px; height:9px; border-radius:{{ s.raio }}; clip-path:{{ s.clip }}; background:{{ s.cor }}; flex:none\"><\u002Fspan>\n                <span style=\"flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13.5px; color:#1C2620; font-weight:500\">{{ s.principal }}<\u002Fspan>\n                <span style=\"font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:.08em; color:#9A958A; text-transform:uppercase; flex:none\">{{ s.tipoLabel }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"width:1px; height:24px; background:#E6DECB; flex:none\"><\u002Fdiv>\n\n      <!-- Série (seleção pendente; aplica no Filtrar) -->\n      <div style=\"display:flex; align-items:center; gap:5px; flex:none\">\n        <sc-for list=\"{{ anosUI }}\" as=\"a\" hint-placeholder-count=\"5\">\n          <button onclick=\"{{ a.onClick }}\" title=\"{{ a.dica }}\" style=\"padding:7px 11px; border-radius:999px; border:1px solid {{ a.borda }}; background:{{ a.bg }}; color:{{ a.cor }}; font-family:'Figtree',system-ui,sans-serif; font-size:13px; font-weight:{{ a.peso }}; cursor:pointer; white-space:nowrap\" style-hover=\"border-color:#06492D\">{{ a.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <!-- Matéria -->\n      <select value=\"{{ materiaSel }}\" onchange=\"{{ onMateria }}\" style=\"padding:8px 26px 8px 11px; border:1px solid {{ materiaBorda }}; border-radius:10px; background:#F7F2E8; font-family:'Figtree',system-ui,sans-serif; font-size:13px; font-weight:600; color:{{ materiaCor }}; cursor:pointer; outline:none; appearance:auto; max-width:170px\">\n        <optio 8,38,32,.16); z-index:60; animation:surgir .14s ease; padding:8px\">\n            <sc-for list=\"{{ turmasUI }}\" as=\"t\" hint-placeholder-count=\"2\">\n              <button onclick=\"{{ t.onFiltrar }}\" title=\"Filtrar por esta turma\" style=\"display:flex; align-items:center; gap:9px; width:100%; padding:8px 10px; border:none; background:transparent; border-radius:9px; cursor:pointer; text-align:left; font-family:'Figtree',system-ui,sans-serif\" style-hover=\"background:#F7F2E8\">\n                <svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#06492D\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none\"><path d=\"M22 10 12 5 2 10l10 5z\"><\u002Fpath><path d=\"M6 12v5c3 3 9 3 12 0v-5\"><\u002Fpath><\u002Fsvg>\n                <span style=\"flex:1; min-width:0; font-size:13px; font-weight:600; color:#1C2620; overflow:hidden; text-overflow:ellipsis; white-space:nowrap\">{{ t.label }}<\u002Fspan>\n                <svg width=\"11\" height=\"11\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#9A958A\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none\"><path d=\"M4 5h16l-6.5 8v5.5L10.5 20v-7z\"><\u002Fpath><\u002Fsvg>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ semTurmas }}\" hint-placeholder-val=\"{{ false }}\">\n              <p style=\"margin:4px 6px 6px; font-size:12px; line-height:1.5; color:#9A958A\">Você ainda não tem turmas cadastradas.<\u002Fp>\n            <\u002Fsc-if>\n            <div style=\"border-top:1px dashed #E6DECB; margin:4px 6px 2px; padding-top:7px\">\n              <button onclick=\"{{ onAbrirPerfilTurmas }}\" style=\"border:none; background:transparent; padding:2px 0; color:#06492D; font-family:'Figtree',system-ui,sans-serif; font-size:12px; font-weight:700; cursor:pointer; text-decoration:underline; text-underline-offset:3px\">Gerenciar turmas no perfil<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <!-- Prévia de vértices + Filtrar -->\n      <sc-if value=\"{{ prevTem }}\" hint-placeholder-val=\"{{ false }}\">\n        <span title=\"Vértices que a consulta vai retornar com os critérios selecionados\" style=\"font-family:'JetBrains Mono',monospace; font-size:11px; color:#06492D; background:#EAF2EC; border:1px solid #CFE0D4; border-radius:999px; padding:6px 12px; white-space:nowrap\">{{ prevQtd }} vértices<\u002Fspan>\n      <\u002Fsc-if>\n      <button onclick=\"{{ onFiltrar }}\" title=\"Consultar o endpoint com os critérios selecionados\" style=\"display:inline-flex; align-items:center; gap:8px; padding:9px 20px; border-radius:999px; border:none; background:#06492D; color:#F7F2E8; font-family:'Figtree',system-ui,sans-serif; font-size:13.5px; font-weight:700; cursor:pointer; opacity:{{ filtrarOpacidade }}\" style-hover=\"background:#053C24\">\n        <svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#F7F2E8\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 5h16l-6.5 8v5.5L10.5 20v-7z\"><\u002Fpath><\u002Fsvg>\n        <span>Filtrar<\u002Fspan>\n      <\u002Fbutton>\n\n      <sc-if value=\"{{ filtrosAtivos }}\" hint-placeholder-val=\"{{ false }}\">\n        <button onclick=\"{{ onLimpar }}\" style=\"padding:7px 10px; border:none; background:transparent; color:#8C3E18; font-family:'Figtree',system-ui,sans-serif; font-size:13px; font-weight:600; cursor:pointer; text-decoration:underline; text-underline-offset:3px\">Limpar<\u002Fbutton>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <!-- ── Área de trabalho: canvas ocupa tudo; painel flutua à esquerda ── -->\n    <div style=\"flex:1; display:flex; min-height:0\">\n      <div style=\"flex:1; position:relative; background:#F3EDDF; overflow:hidden; min-width:0\">\n        <canvas ref=\"{{ canvasRef }}\" data-grafo-canvas=\"1\" style=\"position:absolute; inset:0; width:100%; height:10
